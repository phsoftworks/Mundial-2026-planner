<!DOCTYPE html>
<html>
<head>
  <title>Resize Tool</title>
</head>
<body>

<input type="file" id="upload">
<canvas id="canvas"></canvas>

<script>
const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

upload.onchange = function(e) {
  const file = e.target.files[0];
  const img = new Image();

  img.onload = function() {

    // 🔵 ICON 192
    canvas.width = 192;
    canvas.height = 192;
    ctx.drawImage(img, 0, 0, 192, 192);

    const icon192 = canvas.toDataURL("image/png");
    download(icon192, "icon-192.png");

    // 🟣 ICON 512
    canvas.width = 512;
    canvas.height = 512;
    ctx.drawImage(img, 0, 0, 512, 512);

    const icon512 = canvas.toDataURL("image/png");
    download(icon512, "icon-512.png");

    // 🔴 SPLASH 1080x1920
    canvas.width = 1080;
    canvas.height = 1920;
    ctx.drawImage(img, 0, 0, 1080, 1920);

    const splash = canvas.toDataURL("image/png");
    download(splash, "splash.png");
  };

  img.src = URL.createObjectURL(file);
};

function download(data, name) {
  const a = document.createElement("a");
  a.href = data;
  a.download = name;
  a.click();
}
</script>

</body>
</html>
